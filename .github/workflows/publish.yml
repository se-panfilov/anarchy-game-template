# Build desktop artifacts for selected platforms, then publish to Steam via SteamCMD.
# Builds are delegated to build.yml (reusable workflow).
# Steam upload uses explicit VDF scripts (scripts/steam/) for full control over depot mapping.

name: Publish
run-name: "Publish (ref=${{ inputs.ref }}, steam=${{ inputs.steamBranch }}, win=${{ inputs.buildWindows }}, mac=${{ inputs.buildMac }}, linux=${{ inputs.buildLinux }})"

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
        default: main
        description: "Branch / tag to build from"
      mode:
        type: choice
        required: true
        default: prod
        options:
          - prod
          - dev
        description: "Build mode"

      # ---- Steam ----
      steamBranch:
        type: choice
        required: true
        default: test
        options:
          - pre-release
          - beta
          - test
        description: "Steam branch to set live after upload"

      # ---- Platform toggles ----
      buildWindows:
        type: boolean
        required: true
        default: true
        description: "Windows x64 (nsis)"
      buildMac:
        type: boolean
        required: true
        default: true
        description: "macOS universal (dmg)"
      buildLinux:
        type: boolean
        required: true
        default: true
        description: "Linux x64 (AppImage)"

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Build jobs — one per platform, each calls the reusable build.yml.
# ---------------------------------------------------------------------------

jobs:
  build-windows:
    if: ${{ inputs.buildWindows }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      app: desktop
      mode: ${{ inputs.mode }}
      target: "win:nsis:x64"

  build-mac:
    if: ${{ inputs.buildMac }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      app: desktop
      mode: ${{ inputs.mode }}
      target: "mac:dmg:universal"

  build-linux:
    if: ${{ inputs.buildLinux }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      app: desktop
      mode: ${{ inputs.mode }}
      target: "linux:appimage:x64"

  # ---------------------------------------------------------------------------
  # Publish to Steam — downloads build artifacts, generates VDF, runs SteamCMD.
  # ---------------------------------------------------------------------------

  publish-steam:
    needs: [build-windows, build-mac, build-linux]
    # Run even if some build jobs were skipped (platform unchecked).
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ---- Collect build artifacts into per-platform dirs ----

      - name: Create depot directories
        shell: bash
        run: |
          mkdir -p steam-depots/windows
          mkdir -p steam-depots/macos
          mkdir -p steam-depots/linux

      - name: Download Windows artifact
        if: ${{ inputs.buildWindows }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: steam-depots/windows

      - name: Download macOS artifact
        if: ${{ inputs.buildMac }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-mac.outputs.artifact-name }}
          path: steam-depots/macos

      - name: Download Linux artifact
        if: ${{ inputs.buildLinux }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-linux.outputs.artifact-name }}
          path: steam-depots/linux

      - name: List depot contents
        shell: bash
        run: |
          echo "=== Windows ===" && ls -lah steam-depots/windows/ 2>/dev/null || echo "(empty)"
          echo "=== macOS ===" && ls -lah steam-depots/macos/ 2>/dev/null || echo "(empty)"
          echo "=== Linux ===" && ls -lah steam-depots/linux/ 2>/dev/null || echo "(empty)"

      # ---- Read version ----

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -e "console.log(require('./apps/desktop/package.json').version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ---- Generate VDF ----

      - name: Determine enabled platforms
        id: platforms
        shell: bash
        run: |
          platforms=""
          if [ "${{ inputs.buildWindows }}" = "true" ]; then platforms="${platforms:+$platforms,}win"; fi
          if [ "${{ inputs.buildMac }}" = "true" ]; then platforms="${platforms:+$platforms,}mac"; fi
          if [ "${{ inputs.buildLinux }}" = "true" ]; then platforms="${platforms:+$platforms,}linux"; fi
          echo "list=$platforms" >> "$GITHUB_OUTPUT"
          echo "Enabled platforms: $platforms"

      - name: Generate VDF build script
        shell: bash
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID_WIN: ${{ secrets.STEAM_DEPOT_ID_WIN }}
          STEAM_DEPOT_ID_MAC: ${{ secrets.STEAM_DEPOT_ID_MAC }}
          STEAM_DEPOT_ID_LINUX: ${{ secrets.STEAM_DEPOT_ID_LINUX }}
          BUILD_DESC: "v${{ steps.version.outputs.version }} (${{ inputs.ref }}, ${{ inputs.mode }})"
          CONTENT_ROOT: "${{ github.workspace }}/steam-depots"
          BUILD_OUTPUT: "${{ github.workspace }}/steam-output"
          SET_LIVE: ${{ inputs.steamBranch }}
          VDF_PREVIEW: "0"
          PLATFORMS: ${{ steps.platforms.outputs.list }}
          OUTPUT_DIR: "${{ github.workspace }}/steam-vdf"
        run: node scripts/steam/generate-vdf.mjs

      # ---- SteamCMD ----

      - name: Install SteamCMD
        uses: buildalon/setup-steamcmd@v1

      - name: Write Steam config.vdf
        shell: bash
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          STEAM_HOME="$HOME/Steam"
          mkdir -p "$STEAM_HOME/config"
          echo "$STEAM_CONFIG_VDF" | base64 -d > "$STEAM_HOME/config/config.vdf"
          echo "Wrote config.vdf to $STEAM_HOME/config/config.vdf"

      - name: Upload to Steam
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -euo pipefail
          echo "Uploading to Steam (branch: ${{ inputs.steamBranch }})..."
          steamcmd +login "$STEAM_USERNAME" +run_app_build "${{ github.workspace }}/steam-vdf/app_build.vdf" +quit

      # ---- Summary ----

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Publish summary"
            echo ""
            echo "- Ref: **${{ inputs.ref }}**"
            echo "- Mode: **${{ inputs.mode }}**"
            echo "- Steam branch: **${{ inputs.steamBranch }}**"
            echo "- Version: **${{ steps.version.outputs.version }}**"
            echo ""
            echo "### Platforms"
            echo "- Windows: ${{ inputs.buildWindows }}"
            echo "- macOS: ${{ inputs.buildMac }}"
            echo "- Linux: ${{ inputs.buildLinux }}"
          } >> "$GITHUB_STEP_SUMMARY"
